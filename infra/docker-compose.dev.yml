# Local development: just the backing services. Run the API on the host with
# `npm run dev:api` for hot reload — see apps/api/.env for the matching localhost ports.
#   docker compose -f infra/docker-compose.dev.yml up -d
name: omnianote-dev

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omnianote
      POSTGRES_PASSWORD: omnianote
      POSTGRES_DB: omnianote
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: omnianote
      MINIO_ROOT_PASSWORD: omnianote-dev-secret
    volumes:
      - minio_dev_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 omnianote omnianote-dev-secret; do sleep 1; done &&
      mc mb --ignore-existing local/omnianote-media
      "

  meilisearch:
    image: getmeili/meilisearch:v1.10
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: dev-only-master-key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_dev_data:/meili_data

volumes:
  postgres_dev_data:
  minio_dev_data:
  meili_dev_data:
